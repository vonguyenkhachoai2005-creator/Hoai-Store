<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoai Store - Trang Chủ Laptop</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <div id="toast-container"></div>

    <header class="bg-cps-red sticky top-0 z-40 shadow-md">
        <div class="container mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
            <a href="index.html" class="text-2xl font-bold flex items-center gap-2 text-white !text-white">
                <i class="fa-solid fa-laptop text-white"></i> Hoai Store
            </a>

            <div class="flex-1 max-w-xl min-w-[280px]">
                <div class="relative flex items-center text-gray-900 bg-white rounded-lg px-3 py-2">
                    <i class="fa-solid fa-magnifying-glass text-gray-400 mr-2"></i>
                    <input type="text" id="searchInput" placeholder="Bạn cần tìm laptop gì?" class="w-full bg-transparent border-none outline-none text-sm">
                </div>
            </div>

            <div class="flex items-center gap-6">
                <button id="openLoginBtn" class="bg-red-700 hover:bg-red-800 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 cursor-pointer">
                    <i class="fa-regular fa-user"></i> Đăng nhập
                </button>
                <a href="cart.html" class="relative p-2 hover:bg-red-700 text-white rounded-full transition">
                    <i class="fa-solid fa-cart-shopping text-xl"></i>
                    <span id="cartCount" class="absolute -top-1 -right-1 bg-yellow-400 text-red-950 text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center shadow">0</span>
                </a>
            </div>
        </div>
    </header>

    <section class="container mx-auto px-4 mt-6">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="bg-white rounded-xl shadow-xs p-4 border border-gray-100 hidden lg:block">
                <h3 class="font-bold text-gray-900 mb-3 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-bars text-cps-red"></i> Danh mục thương hiệu
                </h3>
                <ul class="space-y-1 text-sm text-gray-600">
                    <li><button onclick="filterBrand('Macbook')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-red-50 hover:text-cps-red font-medium cursor-pointer transition">Apple (MacBook)</button></li>
                    <li><button onclick="filterBrand('ASUS')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-red-50 hover:text-cps-red font-medium cursor-pointer transition">ASUS ROG / ZenBook</button></li>
                    <li><button onclick="filterBrand('Dell')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-red-50 hover:text-cps-red font-medium pointer-events-auto transition">Dell XPS / Inspiron</button></li>
                    <li><button onclick="filterBrand('HP')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-red-50 hover:text-cps-red font-medium cursor-pointer transition">HP Pavilion / Envy</button></li>
                    <li><button onclick="filterBrand('')" class="w-full text-left px-3 py-2 rounded-lg bg-gray-100 text-gray-800 font-medium mt-2 text-center block cursor-pointer transition">Xem tất cả</button></li>
                </ul>
            </div>

            <div class="lg:col-span-3 bg-white rounded-xl shadow-xs border border-gray-100 p-2 overflow-hidden relative group">
                <img src="https://images.unsplash.com/photo-1618424181497-157f25b6ddd5?w=1200&q=80" alt="Laptop Banner" class="w-full h-48 sm:h-64 object-cover rounded-lg">
                <div class="absolute inset-0 bg-linear-to-r from-black/60 to-transparent flex flex-col justify-center p-8 text-white rounded-lg m-2">
                    <span class="bg-cps-red text-xs font-bold uppercase px-2.5 py-1 rounded w-max mb-2">Khuyến Mãi Hè 2026</span>
                    <h2 class="text-xl sm:text-3xl font-extrabold mb-1">LAPTOP GAMING & VĂN PHÒNG</h2>
                    <p class="text-xs sm:text-sm text-gray-200">Giảm ngay đến 4.000.000đ + Trả góp 0%</p>
                </div>
            </div>
        </div>
    </section>

    <main class="container mx-auto px-4 py-8">
        <h2 class="text-xl font-bold mb-6 flex items-center gap-2 text-gray-900 border-b pb-2 border-gray-200">
            <span class="w-2 h-6 bg-cps-red inline-block rounded"></span> SẢN PHẨM PHỔ BIẾN
        </h2>
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <div id="loginModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 mx-4 relative transform scale-95 transition-transform duration-300">
            <button id="closeLoginBtn" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            <div class="text-center mb-6">
                <h3 class="text-2xl font-bold text-cps-red">Đăng nhập</h3>
            </div>
            <form onsubmit="event.preventDefault(); showToast('Đăng nhập thành công!'); document.getElementById('loginModal').classList.add('hidden');">
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Số điện thoại / Email</label>
                    <input type="text" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm">
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Mật khẩu</label>
                    <input type="password" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm">
                </div>
                <button type="submit" class="w-full bg-cps-red text-white py-2.5 rounded-lg font-bold hover:bg-red-700 cursor-pointer">Đăng nhập</button>
            </form>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: 'MacBook Air M2 2023 (8GB/256GB)', price: 24990000, img: 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=500&q=80' },
            { id: 2, name: 'ASUS ROG Strix G16 Gaming', price: 32490000, img: 'https://images.unsplash.com/photo-1603302576837-37561b2e2302?w=500&q=80' },
            { id: 3, name: 'Dell XPS 13 Plus 9320', price: 41990000, img: 'https://images.unsplash.com/photo-1593642632823-8f785ba67e45?w=500&q=80' },
            { id: 4, name: 'HP Pavilion 14 X360 Cam Ứng', price: 16290000, img: 'https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?w=500&q=80' }
        ];

        function formatMoney(num) { return num.toLocaleString('vi-VN') + ' đ'; }

        function renderProducts(filteredProducts = products) {
            const grid = document.getElementById('productGrid');
            if (filteredProducts.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-8">Không tìm thấy sản phẩm.</p>`;
                return;
            }

            
            grid.innerHTML = filteredProducts.map(p => `
                <div class="bg-white border border-gray-100 rounded-xl p-4 flex flex-col justify-between shadow-xs hover:shadow-md transition">
                    <div class="cursor-pointer" onclick="window.location.href='detail.html?id=${p.id}'">
                        <img src="${p.img}" alt="${p.name}" class="w-full h-40 object-cover rounded-lg mb-4 hover:scale-105 transition duration-300">
                        <h3 class="font-semibold text-sm line-clamp-2 text-gray-900 mb-2 min-h-[40px] hover:text-cps-red">${p.name}</h3>
                    </div>
                    <div>
                        <p class="text-cps-red font-bold text-base mb-3">${formatMoney(p.price)}</p>
                        <button onclick="addToCart(${p.id})" class="w-full border border-cps-red text-cps-red font-semibold py-1.5 rounded-lg text-xs hover:bg-red-50 transition flex items-center justify-center gap-1 cursor-pointer">
                            <i class="fa-solid fa-cart-plus"></i> Thêm vào giỏ
                        </button>
                    </div>
                </div>
            `).join('');
        }

        
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg bg-gray-900 text-white px-5 py-3 rounded-lg shadow-lg mb-3 flex items-center gap-3 text-sm font-medium border-l-4 border-green-500';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-green-400"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        }

        function filterBrand(brandKeyword) {
            const result = products.filter(p => p.name.toLowerCase().includes(brandKeyword.toLowerCase()));
            renderProducts(result);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            const result = products.filter(p => p.name.toLowerCase().includes(keyword));
            renderProducts(result);
        });

        function addToCart(id) {
            let cart = JSON.parse(localStorage.getItem('cps_cart')) || [];
            const p = products.find(prod => prod.id === id);
            const exist = cart.find(item => item.id === id);
            if (exist) { exist.quantity += 1; } else { cart.push({ ...p, quantity: 1 }); }
            localStorage.setItem('cps_cart', JSON.stringify(cart));
            updateCartBadge();
            showToast(`Đã thêm "${p.name}" vào giỏ hàng!`);
        }

        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem('cps_cart')) || [];
            document.getElementById('cartCount').innerText = cart.reduce((sum, item) => sum + item.quantity, 0);
        }

        const modal = document.getElementById('loginModal');
        document.getElementById('openLoginBtn').addEventListener('click', () => {
            modal.classList.remove('hidden'); setTimeout(() => modal.classList.remove('opacity-0'), 10);
        });
        document.getElementById('closeLoginBtn').addEventListener('click', () => {
            modal.classList.add('opacity-0'); setTimeout(() => modal.classList.add('hidden'), 300);
        });

        renderProducts();
        updateCartBadge();
    </script>
</body>
</html>
